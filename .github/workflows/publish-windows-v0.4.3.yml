name: Publish Windows v0.4.3 URL diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-windows-v0.4.3.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Run URL camera recognition regression tests
        run: npm test
      - name: Verify public AHN DTM / DSM availability
        run: node scripts/smoke-ahn.mjs
        continue-on-error: true
      - name: Build Windows installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: streetview-metingen-windows-v0.4.3
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' executables < <(find dist -maxdepth 1 -type f -name '*.exe' -print0)
          if [ "${#executables[@]}" -ne 2 ]; then
            echo "Expected installer and portable EXE, found ${#executables[@]}" >&2
            exit 1
          fi
          for file in "${executables[@]}"; do sha256sum "$file"; done
          gh release create v0.4.3 "${executables[@]}" \
            --target "$GITHUB_SHA" \
            --title "Streetview Metingen v0.4.3 — camera-URL diagnose" \
            --notes-file RELEASE_NOTES_v0.4.3.md \
            --latest
