name: Publish Windows v0.5.1 far point correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-windows-v0.5.1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Run geometry and far distance tests
        run: npm test
      - name: JavaScript syntax verification
        run: |
          node --check desktop-google/app.mjs
          node --check src/geometry.mjs
          node --check src/ahn.mjs
      - name: Verify AHN DTM DSM available
        run: node scripts/smoke-ahn.mjs
        continue-on-error: true
      - name: Build Windows installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Archive Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: streetview-metingen-windows-v0.5.1
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' executables < <(find dist -maxdepth 1 -type f -name '*.exe' -print0)
          if [ "${#executables[@]}" -ne 2 ]; then
            echo "Expected installer and portable executable, got ${#executables[@]}" >&2
            exit 1
          fi
          for file in "${executables[@]}"; do sha256sum "$file"; done
          gh release create v0.5.1 "${executables[@]}" \
            --target "$GITHUB_SHA" \
            --title "Streetview Metingen v0.5.1 — verre punten en XY-correctie" \
            --notes-file RELEASE_NOTES_v0.5.1.md \
            --latest
