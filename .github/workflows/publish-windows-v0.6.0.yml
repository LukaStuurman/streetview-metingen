name: Publish Windows v0.6.0 multi-view triangulation
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-windows-v0.6.0.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Unit tests including multi-panorama triangulation
        run: npm test
      - name: Syntax verification
        run: |
          node --check desktop-google/app.mjs
          node --check src/triangulation.mjs
          node --check src/geometry.mjs
      - name: Live AHN DTM/DSM check
        run: node scripts/smoke-ahn.mjs
        continue-on-error: true
      - name: Build Windows portable and NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Archive Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: streetview-metingen-windows-v0.6.0
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish v0.6.0 GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' executables < <(find dist -maxdepth 1 -type f -name '*.exe' -print0)
          if [ "${#executables[@]}" -ne 2 ]; then
            echo "Expected exactly two EXEs, found ${#executables[@]}" >&2
            exit 1
          fi
          for file in "${executables[@]}"; do sha256sum "$file"; done
          gh release create v0.6.0 "${executables[@]}" \
            --target "$GITHUB_SHA" \
            --title "Streetview Metingen v0.6.0 — triangulatie meerdere panorama's" \
            --notes-file RELEASE_NOTES_v0.6.0.md \
            --latest
