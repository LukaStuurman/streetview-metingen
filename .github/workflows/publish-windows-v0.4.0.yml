name: Publish Windows v0.4.0 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-windows-v0.4.0.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Run unit and browser URL tests
        run: npm test
      - name: Check live AHN DTM and DSM (non-blocking)
        run: node scripts/smoke-ahn.mjs
        continue-on-error: true
      - name: Build Windows installer and portable version
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: streetview-metingen-windows-v0.4.0
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish v0.4.0 release with both executables
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' executables < <(find dist -maxdepth 1 -type f -name '*.exe' -print0)
          if [ "${#executables[@]}" -ne 2 ]; then
            echo "Expected Windows setup and portable EXE; got ${#executables[@]}" >&2
            exit 1
          fi
          for file in "${executables[@]}"; do sha256sum "$file"; done
          gh release create v0.4.0 "${executables[@]}" \
            --target "$GITHUB_SHA" \
            --title "Streetview Metingen v0.4.0 — AHN DSM + Google Maps in de app" \
            --notes-file RELEASE_NOTES_v0.4.0.md \
            --latest
