name: Publish Windows v0.5.0 Techbase RD coordinates
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-windows-v0.5.0.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron and builder
        run: npm install --no-audit --no-fund
      - name: Unit tests for RD, local XY, UI regression
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check desktop-google/app.mjs
          node --check src/rd.mjs
      - name: Check live AHN DTM and DSM availability
        run: node scripts/smoke-ahn.mjs
        continue-on-error: true
      - name: Build Windows installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: streetview-metingen-windows-v0.5.0
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' executables < <(find dist -maxdepth 1 -type f -name '*.exe' -print0)
          if [ "${#executables[@]}" -ne 2 ]; then
            echo "Expected Windows Setup and portable EXE files; got ${#executables[@]}" >&2
            exit 1
          fi
          for file in "${executables[@]}"; do sha256sum "$file"; done
          gh release create v0.5.0 "${executables[@]}" \
            --target "$GITHUB_SHA" \
            --title "Streetview Metingen v0.5.0 — Techbase & RD X/Y" \
            --notes-file RELEASE_NOTES_v0.5.0.md \
            --latest
